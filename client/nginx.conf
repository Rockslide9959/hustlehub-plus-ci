# Nginx config for the HustleHub+ React SPA container.
# Serves the Vite build output and reverse-proxies /api to the api container.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Gzip static assets for smaller payloads
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  # Hide the Nginx version in Server headers
  server_tokens off;

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers applied to every response the SPA serves.
    # (The API container sends its own Helmet headers for /api responses.)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # Reverse-proxy API calls to the backend service on the compose network.
    # The hostname 'api' is the service name in docker-compose.yml.
    location /api/ {
      proxy_pass         http://api:4000;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    # Cache hashed Vite build assets aggressively — they are content-hashed,
    # so changes always produce a new filename.
    location /assets/ {
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # SPA fallback: any unknown path returns index.html so React Router can
    # handle client-side routes.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}