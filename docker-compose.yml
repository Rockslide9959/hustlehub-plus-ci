# HustleHub+ orchestration for local development and CI smoke tests.
# Brings up the API and the Nginx-served React SPA on a private network.
# MongoDB Atlas is used as the database (no local mongo container), so set
# MONGO_URI in the .env.docker file alongside this compose file.

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: hustlehub-api:latest
    container_name: hustlehub-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      USE_HTTPS: "false"
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      CLIENT_ORIGIN: http://localhost:8080
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    networks:
      - hustlehub-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: hustlehub-client:latest
    container_name: hustlehub-client
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - hustlehub-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  hustlehub-net:
    driver: bridge