name: CI

# HustleHub+ CI/CD pipeline 
on:
  push:
    branches: [main, develop, Dev]
  pull_request:
    branches: [main, develop, Dev]

# Cancel an older run of the same branch when a newer commit arrives.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the pipeline only needs to read the repository.
permissions:
  contents: read

# Runners are pinned to Ubuntu 24.04: ubuntu-latest moved to Ubuntu 26 in
# October 2026, where Playwright cannot install its browser dependencies yet.
env:
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------------
  # 1. install: checkout, Node, cache, install backend + frontend dependencies.
  #    `npm ci` also fails if a package-lock.json is out of sync with package.json.
  # ---------------------------------------------------------------------------
  install:
    name: Install dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            client/package-lock.json

      - name: Install backend dependencies
        working-directory: api
        run: npm ci

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Explain failure
        if: failure()
        run: |
          echo "::error title=Install failed::npm ci failed. Usually a package-lock.json is out of sync with package.json. Run 'npm install' in api/ or client/ and commit the lockfile."

  # ---------------------------------------------------------------------------
  # 2. backend-test: Jest unit tests, then Newman against the Postman collection
  #    running on a real API and a MongoDB replica set (needed for transactions).
  # ---------------------------------------------------------------------------
  backend-test:
    name: Backend tests (Jest + Newman)
    runs-on: ubuntu-24.04
    needs: install
    env:
      PORT: "4000"
      USE_HTTPS: "false"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install backend dependencies
        working-directory: api
        run: npm ci

      - name: Jest unit tests
        working-directory: api
        run: npm test

      - name: Start MongoDB replica set
        run: |
          docker run -d --name mongo-ci -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo-ci mongosh --quiet --eval 'db.runCommand({ping:1}).ok' >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec mongo-ci mongosh --quiet --eval \
            "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]})"
          for i in $(seq 1 30); do
            docker exec mongo-ci mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true && exit 0
            sleep 2
          done
          echo "::error::MongoDB replica set did not become PRIMARY"; exit 1

      - name: Create run-time secrets (never stored in the repository)
        run: |
          # Use the repository secrets when set, otherwise generate throw-away values.
          JWT="${{ secrets.JWT_SECRET }}"
          [ -n "$JWT" ] || JWT="$(openssl rand -hex 32)"
          echo "::add-mask::$JWT"
          echo "JWT_SECRET=$JWT" >> "$GITHUB_ENV"
          URI="${{ secrets.MONGO_URI_TEST }}"
          [ -n "$URI" ] || URI="mongodb://localhost:27017/hustlehub_test?replicaSet=rs0"
          echo "::add-mask::$URI"
          echo "MONGO_URI=$URI" >> "$GITHUB_ENV"

      - name: Start the API
        working-directory: api
        run: |
          nohup node server.js > ../api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:4000/ >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "::error::API did not start"; cat ../api.log; exit 1

      - name: Newman API tests (Postman collection)
        working-directory: api
        run: |
          npx newman run ../postman/HustleHub.postman_collection.json \
            -e ../postman/HustleHub.postman_environment.json \
            --env-var url=http://localhost:4000 \
            -r cli,htmlextra --reporter-htmlextra-export ../newman-report.html

      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman-report.html
          if-no-files-found: ignore

      - name: Show API log on failure
        if: failure()
        run: |
          echo "::error title=Backend tests failed::See the failing step above. API log follows."
          tail -n 100 api.log || true

  # ---------------------------------------------------------------------------
  # 3. frontend-test: lint, Jest/RTL unit tests, Playwright browser tests.
  # ---------------------------------------------------------------------------
  frontend-test:
    name: Frontend tests (Jest + Playwright)
    runs-on: ubuntu-24.04
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Lint
        working-directory: client
        run: npm run lint

      - name: Jest unit tests
        working-directory: client
        run: npm test

      - name: Install Playwright browser
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Playwright end-to-end tests
        working-directory: client
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report
          if-no-files-found: ignore

      - name: Explain failure
        if: failure()
        run: echo "::error title=Frontend tests failed::Open the 'playwright-report' artifact for traces and screenshots."

  # ---------------------------------------------------------------------------
  # 4. static-analysis (owner: Ethan). Three tools; any finding fails the job.
  #    a) SonarJS + eslint-plugin-security (static-analysis/): always runs.
  #    b) Semgrep SAST (JavaScript, Node.js, React and secrets rules): always runs.
  #    c) SonarCloud: only where the SONAR_ENABLED variable is 'true'. The
  #       classroom organisation blocks the SonarCloud app, so it runs on a
  #       personal public copy of the repo. Here those steps are skipped.
  # ---------------------------------------------------------------------------
  static-analysis:
    name: Static analysis (SonarJS, Semgrep, SonarCloud)
    runs-on: ubuntu-24.04
    needs: install
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            client/package-lock.json

      - name: SonarJS and security rules (fails on any finding)
        working-directory: static-analysis
        run: |
          npm ci
          npm run scan

      - name: Save the SonarJS report
        if: always()
        working-directory: static-analysis
        run: npm run report || true

      - name: Semgrep SAST scan (fails on high-severity findings)
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.184.0 \
            semgrep scan --metrics=off \
              --config p/javascript --config p/nodejs --config p/react --config p/secrets \
              --exclude node_modules --exclude coverage --exclude dist \
              --exclude __tests__ --exclude '*.test.js' --exclude '*.test.jsx' \
              --exclude client/e2e --exclude postman --exclude docs \
              --json --output semgrep-report.json \
              --severity ERROR --error

      - name: Upload static analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            static-analysis/reports/static-analysis-report.json
            semgrep-report.json
          if-no-files-found: ignore

      - name: Install dependencies (for SonarCloud coverage)
        if: vars.SONAR_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          (cd api && npm ci)
          (cd client && npm ci)

      - name: Check the Sonar token exists
        if: vars.SONAR_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error title=SONAR_TOKEN missing::Add SONAR_TOKEN under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Backend coverage
        if: vars.SONAR_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        working-directory: api
        run: npx jest --runInBand --forceExit --coverage --coverageReporters=lcov

      - name: Frontend coverage
        if: vars.SONAR_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        working-directory: client
        run: npx jest --coverage --coverageReporters=lcov

      - name: SonarCloud scan
        if: vars.SONAR_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true

      - name: Explain failure
        if: failure()
        run: echo "::error title=Static analysis failed::A static analysis check found a problem. Open the failing step above, or download the static-analysis-reports artifact (and the SonarCloud dashboard where enabled)."

  # ---------------------------------------------------------------------------
  # 5. security-checks: dependency audit, dependency review, secret scan, image/fs scan.
  # ---------------------------------------------------------------------------
  security-checks:
    name: Security checks
    runs-on: ubuntu-24.04
    needs: install
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm audit (backend, production dependencies)
        working-directory: api
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit (frontend, production dependencies)
        working-directory: client
        run: npm audit --omit=dev --audit-level=high

      - name: Dependency review (pull requests only)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - name: Secret scan (Gitleaks, full history)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --redact --no-banner --verbose --exit-code 1

      - name: Vulnerability scan of the source tree (Trivy)
        run: |
          docker run --rm -v "$PWD:/repo" aquasec/trivy:0.58.0 \
            fs --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 --no-progress /repo

      - name: Explain failure
        if: failure()
        run: echo "::error title=Security check failed::A vulnerable dependency or a committed secret was found. Fix it before merging; do not bypass this job."

  # ---------------------------------------------------------------------------
  # 6. build: production builds of the frontend and backend, kept as artefacts.
  # ---------------------------------------------------------------------------
  build:
    name: Build artefacts
    runs-on: ubuntu-24.04
    needs: [backend-test, frontend-test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            client/package-lock.json

      - name: Build frontend (Vite)
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Package backend (production dependencies only)
        working-directory: api
        run: |
          npm ci --omit=dev
          node --check server.js
          tar -czf ../api-dist.tgz --exclude=__tests__ --exclude=coverage .

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: client/dist

      - uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: api-dist.tgz

      - name: Explain failure
        if: failure()
        run: echo "::error title=Build failed::The production build did not complete."

  # ---------------------------------------------------------------------------
  # 7. docker-build: build both images, start the whole stack with Compose
  #    (API + Nginx client + MongoDB replica set) and smoke-test it.
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker build and smoke test
    runs-on: ubuntu-24.04
    needs: install
    steps:
      - uses: actions/checkout@v4

      - name: Create run-time secrets
        run: |
          JWT="$(openssl rand -hex 32)"
          ADMIN="$(openssl rand -hex 16)"
          echo "::add-mask::$JWT"
          echo "::add-mask::$ADMIN"
          {
            echo "JWT_SECRET=$JWT"
            echo "ADMIN_PASSWORD=$ADMIN"
            echo "MONGO_URI=mongodb://mongo:27017/hustlehub_ci?replicaSet=rs0"
          } > .env

      - name: Build images and start the stack
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build --wait --wait-timeout 180

      - name: Show running containers
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml ps

      - name: Smoke test, API (health, security headers)
        run: |
          curl -fsS http://localhost:4000/
          curl -fsSI http://localhost:4000/ | grep -i "x-content-type-options: nosniff"

      - name: Smoke test, client (Nginx serves the SPA and proxies /api)
        run: |
          curl -fsS http://localhost:8080/ | grep -qi "<div id=\"root\""
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/gigs)
          echo "GET /api/gigs through Nginx returned $code"
          [ "$code" = "200" ] || [ "$code" = "401" ]

      - name: Smoke test, client security headers (CSP on pages and assets)
        run: |
          page_headers=$(curl -fsSI http://localhost:8080/)
          echo "$page_headers" | grep -i "content-security-policy: default-src 'self'"
          echo "$page_headers" | grep -i "x-frame-options: DENY"
          asset=$(curl -fsS http://localhost:8080/ | grep -o '/assets/[^"]*\.js' | head -1)
          echo "Checking $asset"
          curl -fsSI "http://localhost:8080$asset" | grep -i "content-security-policy: default-src 'self'"

      - name: Smoke test, containers do not run as root
        run: |
          [ "$(docker exec hustlehub-api id -u)" != "0" ] || { echo "::error::API container runs as root"; exit 1; }

      - name: Run the Postman collection against the containers
        run: |
          npx --yes newman@6 run postman/HustleHub.postman_collection.json \
            -e postman/HustleHub.postman_environment.json \
            --env-var url=http://localhost:4000

      - name: Container logs on failure
        if: failure()
        run: |
          echo "::error title=Docker stage failed::Container logs follow."
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  # ---------------------------------------------------------------------------
  # Gate: always runs, and fails the pipeline if ANY job failed or was skipped
  # unexpectedly. Use this job as the required status check on main.
  # ---------------------------------------------------------------------------
  pipeline-status:
    name: Pipeline status
    runs-on: ubuntu-24.04
    if: always()
    needs: [install, backend-test, frontend-test, static-analysis, security-checks, build, docker-build]
    steps:
      - name: Evaluate results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result=="failure" or .value.result=="cancelled")] | length')
          if [ "$bad" != "0" ]; then
            echo "::error title=Pipeline FAILED::$bad job(s) failed. Do not merge."
            exit 1
          fi
          echo "All required jobs passed."

      - name: Fail loudly
        if: failure()
        run: echo "::error title=CI failed::At least one required check failed. See the red job above."
