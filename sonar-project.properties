# SonarCloud static code analysis for HustleHub+ (owner: Ethan).
# Used by the static-analysis job in .github/workflows/ci.yml, which runs the
# scan and fails the pipeline when the SonarCloud quality gate fails.

# ---------------------------------------------------------------------------
# Project identity in SonarCloud. They are not secrets.
# SonarCloud cannot be installed on the classroom organisation, so the scan
# runs on Ethan's public CI copy of this repository:
#   https://github.com/Rockslide9959/hustlehub-plus-ci
#   https://sonarcloud.io/project/overview?id=Rockslide9959_hustlehub-plus-ci
# The SONAR_TOKEN that authorises the scan IS a secret and lives only in
# GitHub (Settings > Secrets and variables > Actions), never in this file.
# ---------------------------------------------------------------------------
sonar.projectKey=Rockslide9959_hustlehub-plus-ci
sonar.organization=rockslide9959
sonar.projectName=HustleHub+
sonar.sourceEncoding=UTF-8

# ---------------------------------------------------------------------------
# What is analysed
# The backend (api) and the React app (client/src) are the application code.
# ---------------------------------------------------------------------------
sonar.sources=api,client/src

# Tests are analysed as TEST code, not as application code. Sonar refuses to
# index a file twice, so test files are listed under sonar.tests and removed
# from the sources with sonar.exclusions below.
sonar.tests=api/__tests__,client/src
sonar.test.inclusions=api/__tests__/**,client/src/**/*.test.js,client/src/**/*.test.jsx,client/src/test/**

# Not our code, generated output, or evidence files
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/*.test.js,\
  **/*.test.jsx,\
  api/__tests__/**,\
  client/src/test/**,\
  docs/**,\
  postman/**,\
  client/e2e/**,\
  client/test-evidence/**

# Not counted towards coverage:
#   - api/server.js: the start-up file (opens the HTTPS/HTTP server and the
#     database connection). Unit tests never start the real server; it is
#     exercised by the Newman tests against the running API instead.
#   - the admin script, the React entry point and the test helpers
sonar.coverage.exclusions=\
  api/server.js,\
  api/scripts/**,\
  client/src/main.jsx,\
  client/src/test/**

# ---------------------------------------------------------------------------
# Coverage: produced by the pipeline (jest --coverage) before the scan runs
# ---------------------------------------------------------------------------
sonar.javascript.lcov.reportPaths=api/coverage/lcov.info,client/coverage/lcov.info
